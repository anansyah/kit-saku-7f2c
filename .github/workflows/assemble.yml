name: Assemble
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'tools/**'

jobs:
  rakit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Susun
        env:
          NAME: EraaiDailyNews
          VERSION_CODE: ${{ vars.VERSION_CODE || '2' }}
          VERSION_NAME: ${{ vars.VERSION_NAME || '2.0' }}
          KUNCI_B64: ${{ secrets.KUNCI_B64 }}
          KUNCI_STOREPASS: ${{ secrets.KUNCI_STOREPASS }}
          KUNCI_KEYPASS: ${{ secrets.KUNCI_KEYPASS }}
        run: bash tools/assemble.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rakitan
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
